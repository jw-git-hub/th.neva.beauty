<!-- Знак бренда: плюмерия из круглой печати Neva Beauty
     (Материалы/logo-варианты/E-плюмерия-печать-светлая.svg).
     Координаты — из исходной печати 1000×1000, чтобы знак на сайте и на аватарах
     соцсетей был геометрически одним и тем же цветком. Пять лепестков через 72°
     вокруг точки 500 420.6, поверх них сердцевина: без неё в середине остаётся
     белая звезда — лепестки в центре не смыкаются.
     Цвета совпадают с токенами палитры: rose-soft #CE9B91, его светлый тон #E2B9AE
     и rose #92655E у сердцевины.
     opacity у лепестков не выписан намеренно: в печати он равен 1.0 у всех пяти.
     class первым атрибутом: хелпер icon() в build.py подменяет его и отбрасывает
     всё, что стоит до него. -->
