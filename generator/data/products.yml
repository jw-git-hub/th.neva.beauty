# Товар салона — витрина /kosmetika/.
#
# Источник истины по косметике: отсюда собирается страница, разметка Product
# и сверка цен в check_prices.py. Корзины на сайте нет, отдельных страниц
# у товара тоже: карточка ведёт в мессенджер, где и происходит сделка.
#
# Цены — данные заказчика, в той же форме, что в prices.json: число и знак бата.
# Названия — официальные, как на сайтах брендов (us.davines.com, lebel.co.jp),
# а не как на ценнике: по ним товар ищут и сверяют состав.
# source — адрес, откуда взят исходный рендер; по нему make_product_images.py
# пересобирает мастер-кадры, не заставляя искать картинку заново.

page:
  seo_title: "Косметика для волос на Самуи: Davines и LEBEL — Neva Beauty"
  seo_desc: >-
    Профессиональный уход для волос Davines и LEBEL в салоне Neva Beauty
    на Самуи: шампуни, кондиционеры, маски, масла. Цены 1100–2100 ฿,
    забрать можно в салоне.
  h1: "Косметика для волос Davines и LEBEL на Самуи"
  intro: >-
    Профессиональный уход, которым мастера работают на процедурах, — эти же
    средства можно забрать домой. Корзины на сайте нет: напишите в мессенджер,
    отложим товар и отдадим в салоне.
  booking_title: "Заберите уход в салоне"
  booking_lead: >-
    Напишите, какое средство вам нужно или что происходит с волосами, —
    подберём и отложим.

  # Шаги вместо корзины. Без них страница обрывается на цене: посетитель видит
  # товар, но не понимает, что дальше делать, а кнопки «Купить» здесь нет.
  steps_title: "Как купить косметику в салоне"
  steps:
    - icon: message-circle
      title: "Напишите в мессенджер"
      text: "Скажите, что нужно, или опишите волосы — подскажем, что подойдёт."
    - icon: check
      title: "Отложим за вами"
      text: "Проверим, что средство на полке, и оставим его до вашего визита."
    - icon: map-pin
      title: "Заберёте в салоне"
      text: "Адрес пришлём в переписке — на сайте он не публикуется."

  # Переход в услуги: со страницы товара выхода в процедуры иначе нет,
  # а средство и процедура продают друг друга.
  services_title: "Что делают этими средствами в салоне"
  services:
    - uhod-za-volosami
    - davines-naturaltech-tailoring
    - keratinovoe-vypryamlenie-volos
    - biozavivka-volos
    - tokio-inkarami

  faq_title: "Частые вопросы о косметике для волос"
  faq:
    - q: "Это оригинальная косметика?"
      a: >-
        Да. Это профессиональные линейки Davines и LEBEL — те же средства,
        которыми мастера работают на процедурах в салоне.
    - q: "Можно купить, не записываясь на процедуру?"
      a: >-
        Да. Напишите в {whatsapp}, что нужно, — договоримся, когда вам удобно
        зайти и забрать.
    - q: "Как понять, что подойдёт моим волосам?"
      a: >-
        Опишите в переписке, что с волосами происходит: пушатся, электризуются,
        теряют цвет после моря. Или спросите мастера прямо на процедуре —
        он видит волосы вживую.
    - q: "Есть доставка?"
      a: >-
        Нет, доставки и корзины на сайте нет. Товар откладываем и отдаём
        в салоне на Самуи.

