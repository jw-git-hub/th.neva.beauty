      Корейская марка, специализация которой — солнцезащита. Её идея — точная
      доза: на лицо за одно нанесение нужен примерно грамм крема. Поэтому крем
      расфасован в стики по 1 g, а к тубе приложена мерная ложка.
      У всех средств SPF 50+ PA++++.
