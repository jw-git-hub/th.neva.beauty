# Товар салона — витрина /kosmetika/.
#
# Источник истины по косметике: отсюда собирается страница, разметка Product
# и сверка цен в check_prices.py. Корзины на сайте нет, отдельных страниц
# у товара тоже: карточка ведёт в мессенджер, где и происходит сделка.
#
# Цены — данные заказчика, в той же форме, что в prices.json: число и знак бата.
# Названия — официальные, как на сайтах брендов (us.davines.com, lebel.co.jp),
# а не как на ценнике: по ним товар ищут и сверяют состав.
# source — адрес, откуда взят исходный рендер; по нему make_product_images.py
# пересобирает мастер-кадры, не заставляя искать картинку заново.

page:
  seo_title: "Косметика для волос на Самуи: Davines и LEBEL — Neva Beauty"
  seo_desc: >-
    Профессиональный уход для волос Davines и LEBEL в салоне Neva Beauty
    на Самуи: шампуни, маски, масла. Цены 1100–2100 ฿,
    забрать в салоне или доставка по Таиланду.
  h1: "Косметика для волос Davines и LEBEL на Самуи"
  intro: >-
    Davines и LEBEL — марки, на которых работают мастера салона. То, что стоит
    на полке, можно забрать домой. Корзины на сайте нет: напишите в мессенджер,
    а дальше как удобно — заберёте в салоне или отправим доставкой по Таиланду.
  booking_title: "Заберите уход в салоне или закажите доставку"
  booking_lead: >-
    Напишите, какое средство вам нужно или что происходит с волосами, —
    подберём, отложим и договоримся, как вам его передать.
  # Общий блок внизу страницы подписан «Запись» и заканчивается правилом
  # «перенести или отменить запись можно не позднее чем за сутки». Здесь ничего
  # не записывают: подпись своя, а правило снято — правила отмены у покупки нет,
  # а чужое сбивает с толку последней строкой перед подвалом.
  booking_eyebrow: "Заказ"
  booking_rule: ""

  # Шаги вместо корзины. Без них страница обрывается на цене: посетитель видит
  # товар, но не понимает, что дальше делать, а кнопки «Купить» здесь нет.
  steps_title: "Как купить косметику без корзины"
  steps:
    - icon: message-circle
      title: "Напишите в мессенджер"
      text: "Скажите, что нужно, или опишите волосы — подскажем, что подойдёт."
    - icon: check
      title: "Отложим за вами"
      text: "Проверим, что средство на полке, и оставим его до вашего визита."
    - icon: map-pin
      title: "Заберёте или привезём"
      text: >-
        Забрать можно в салоне — адрес пришлём в переписке. Если вы не на Самуи,
        отправим доставкой по Таиланду.

  # Переход в услуги: со страницы товара выхода в процедуры иначе нет.
  # Заголовок блока намеренно не утверждает, что процедуры делают этими же
  # средствами: Tokio Inkarami, кератин и биозавивка работают на своих составах,
  # и такая связка была бы выдумкой. Это просто соседние услуги для волос.
  services_title: "Услуги для волос в этом же салоне"
  services:
    - uhod-za-volosami
    - davines-naturaltech-tailoring
    - keratinovoe-vypryamlenie-volos
    - biozavivka-volos
    - tokio-inkarami

  faq_title: "Частые вопросы о косметике для волос"
  faq:
    - q: "Это оригинальная косметика?"
      a: >-
        Да. Это профессиональные линейки Davines и LEBEL — те же марки,
        на которых работают мастера салона.
    - q: "Можно купить, не записываясь на процедуру?"
      a: 'Да. Напишите в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a>, что нужно, — договоримся, как вам удобнее получить: зайти в салон или оформить доставку.'
    - q: "Как понять, что подойдёт моим волосам?"
      a: >-
        Опишите в переписке, что с волосами происходит: пушатся, электризуются,
        теряют цвет после моря. Или спросите мастера прямо на процедуре —
        он видит волосы вживую.
    - q: "Есть доставка?"
      a: 'Да, отправляем по Таиланду. На Самуи проще забрать в салоне — адрес пришлём в переписке. Корзины на сайте нет: способ доставки и сроки обсуждаем в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a> при заказе.'

