brand: "Neva Beauty"                    # короткая форма — для title
brand_full: "Neva Beauty — Koh Samui"   # полная форма — шапка, футер, schema, тексты
brand_location: "Koh Samui"
tagline: "Салон красоты · Самуи"
location: "о. Самуи, Таиланд"
hours: "Приём по записи"
# Правило переноса записи — под кнопкой записи на всех страницах. Константа
# бизнеса, а не текст страницы: правило одно на весь сайт. Подробности (опоздание,
# неявка, предоплата) — в FAQ главной, здесь только то, что нужно знать до записи.
booking_rule: "Перенести или отменить запись можно не позднее чем за сутки."
base_url: "https://th.neva.beauty"
# Префикс пути для ссылок на ассеты/внутренние страницы (не SEO-URL, те всегда base_url).
# Пусто = сайт в корне домена (боевой). "/th.neva.beauty" = превью на GitHub Pages по подпути.
base_path: ""
# Яндекс.Метрика: счётчик перенесён со старого сайта doctor-cosmetolog.pro.
metrika_id: 99850063

# Подтверждение прав в панелях вебмастеров — мета-теги на главной.
# Почему не DNS: имя `th` в зоне neva.beauty занято записью CNAME на GitHub Pages,
# а рядом с CNAME других записей быть не может (RFC 1034 §3.6.2). Резолвер отдаёт
# на запрос TXT сам CNAME, и подтверждение по DNS не проходит — проверено `dig`.
# Отсюда же следствие: в Search Console заводится ресурс с префиксом URL
# (https://th.neva.beauty/), доменный без TXT недоступен.
# Пустое значение = тег не выводится, так что снять подтверждение можно, очистив строку.
verification:
  # Токен ресурса с префиксом URL, способ «HTML-тег». Токен доменного ресурса
  # (google-site-verification=OOD-Swoa1YW_JqvbsBwZuT87PpfK6dyFmofOnIH-bWU из задачи 66)
  # сюда не подходит: у каждого типа ресурса он свой.
  google: "n2Gup2kYzjw0pk2ZhTbgltdatmneJes7GSwy8JrXDCo"
  # Яндекс выдаёт один код на все три способа: мета-тег, файл yandex_<код>.html
  # и запись DNS. Значение взято из задачи 67, где оно показано как DNS-запись.
  yandex: "073be936857d814d"
contacts:
  whatsapp_number: "79990289115"
  whatsapp_url: "https://wa.me/79990289115"
  telegram_url: "https://t.me/shyrakras"
  # Аккаунт со старым брендом — переименование отложено решением заказчика.
  instagram_url: "https://www.instagram.com/avocado.beauty.samui/"

# Превью ссылки в мессенджерах и соцсетях. Размер один на все страницы: карточки
# WhatsApp, Telegram и Facebook рассчитаны на 1200×630, размер объявляем в разметке,
# чтобы краулер нарисовал карточку, не дожидаясь загрузки файла.
og_image:
  default: "/assets/img/og-cover.jpg"  # главная и служебные страницы
  # Подпись к карточке, а не к фотографии: с задачи 96 в og-cover нарисованы печать,
  # название и разделы. Раньше сюда подставлялся alt фотографии из первого экрана —
  # он описывал совсем другую картинку и упоминал макияж, которого салон не оказывает.
  default_alt: "Neva Beauty — Koh Samui: салон красоты и косметология на Самуи"
  width: 1200
  height: 630
  type: "image/jpeg"

# Единый источник фактов о бизнесе для JSON-LD (schema.org). Только реальные
# данные; чего нет — не выдумываем.
business:
  type: "BeautySalon"                 # салон красоты, не мед-клиника
  telephone: "+79990289115"           # основной телефон, он же WhatsApp
  price_range: "฿฿"                   # качественный ориентир (Google priceRange)
  currency: "THB"
  currency_sign: "฿"                  # подпись цены на карточках услуг
  currency_note: "Указаны в тайских батах (฿)."
  language: ["Russian", "English"]    # языки обслуживания → availableLanguage в ContactPoint
  language_code: "ru"
  image: "/assets/img/og-cover.jpg"  # Google ждёт для бизнеса кадр от 1200px по ширине
  logo: "/assets/img/logo-neva-beauty.png"  # круглая печать, 512 px (make_brand_assets.py)
  same_as:
    - "https://www.instagram.com/avocado.beauty.samui/"
  address:
    locality: "Koh Samui"
    region: "Surat Thani"
    country: "TH"
    # streetAddress не публикуем — решение заказчика; адрес выдаётся при записи
  # geo не публикуем (адрес по записи)
  # openingHours не задаём — приём по записи (см. site.hours)
