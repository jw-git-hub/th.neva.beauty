        a: 'Курс и у <a href="/endosfera-terapiya/">эндосфера-терапии</a>, и у <a href="/massazh/">массажа</a> рассчитан на 10 процедур, но интервал у них разный: на эндосферу ходят два раза в неделю, на массаж — два-три. Значит, курс эндосфера-терапии занимает около пяти недель, курс массажа — от трёх до пяти. Скажите при записи в Neva Beauty — Koh Samui, сколько дней у вас есть: план подстроят под сроки поездки. Оплаченные сеансы не сгорают — остаток можно пройти в следующий приезд.'
      - q: "Есть ли противопоказания у процедур для тела?"
        a: 'Да. У аппаратной <a href="/endosfera-terapiya/">эндосфера-терапии</a> есть ограничения — например, беременность, некоторые сосудистые и кожные состояния, обострения хронических заболеваний. Ограничения есть и у <a href="/massazh/">массажа</a>. Поэтому в Neva Beauty — Koh Samui первому сеансу предшествует консультация: уточняют состояние здоровья и подбирают зоны.'
      - q: "Как записаться на процедуры для тела?"
        a: 'Напишите в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a>, <a href="{telegram}" target="_blank" rel="noopener">Telegram</a> или <a href="{instagram}" target="_blank" rel="noopener">Instagram</a> и укажите зоны, которые хотите проработать. Приём в Neva Beauty — Koh Samui — по предварительной записи, обслуживание на русском и английском.'

