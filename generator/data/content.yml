        a: "Да, в Neva Beauty — Koh Samui это отдельная процедура: кислотная смывка плюс техника осветления. Стоимость — {price:uhod-za-volosami:Выход из чёрного}, для длинных и густых волос — {price:uhod-za-volosami:Выход из чёрного - Длинные / густые волосы}. За один визит из чёрного выходят редко: чем темнее и стойче краска, тем больше сеансов понадобится, и их число мастер называет после оценки волос."
