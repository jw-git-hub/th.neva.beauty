      - q: "Какие виды эпиляции делают на Самуи в Neva Beauty?"
        a: 'Методов эпиляции в Neva Beauty — Koh Samui три: <a href="/lazernaya-epilyaciya/">лазерная эпиляция</a>, <a href="/elektroepilyaciya/">электроэпиляция</a> и <a href="/saharnaya-epilyaciya/">сахарная эпиляция (шугаринг)</a>. Обрабатываются зоны лица и тела, есть комбинированные сеты из нескольких зон.'
      - q: "Чем лазерная эпиляция отличается от сахарной и электроэпиляции?"
        a: '<a href="/lazernaya-epilyaciya/">Лазер</a> воздействует светом на пигмент волоса и работает курсом. <a href="/saharnaya-epilyaciya/">Сахарная эпиляция</a> удаляет волос вместе с корнем механически, результат держится до отрастания. <a href="/elektroepilyaciya/">Электроэпиляция</a> обрабатывает каждый волос отдельно микроэлектродом и подходит для единичных и светлых волос.'
      - q: "Сколько стоит эпиляция на Самуи?"
        a: 'Цена зависит от метода и зоны. В Neva Beauty — Koh Samui глубокое бикини — {price:lazernaya-epilyaciya:Глубокое бикини} лазером и {price:saharnaya-epilyaciya:Глубокое бикини} сахарной пастой, подмышки — {price:lazernaya-epilyaciya:Подмышки} и {price:saharnaya-epilyaciya:Подмышечные впадины}, ноги полностью — {price:lazernaya-epilyaciya:Ноги полностью} и {price:saharnaya-epilyaciya:Ноги полностью}. Комбинированный сет «подмышки + глубокое бикини + ноги до колен» на лазере — {price:lazernaya-epilyaciya:Подмышки + глубокое бикини + ноги до колен}, это выгоднее, чем те же зоны по отдельности. Полные прайсы в тайских батах (฿) — на страницах <a href="/lazernaya-epilyaciya/">лазерной</a>, <a href="/elektroepilyaciya/">электро-</a> и <a href="/saharnaya-epilyaciya/">сахарной эпиляции</a>.'
      - q: "Сколько сеансов эпиляции нужно и как часто её повторяют?"
        a: 'Число сеансов индивидуально: волосы растут циклами, и за один раз обрабатываются не все. <a href="/lazernaya-epilyaciya/">Лазерную эпиляцию</a> делают курсом с интервалами между сеансами, <a href="/elektroepilyaciya/">электроэпиляцию</a> — тоже курсом, но волос за волосом. <a href="/saharnaya-epilyaciya/">Сахарную</a> повторяют по мере отрастания волос, обычно раз в несколько недель. Если вы на Самуи ненадолго, за поездку реально успеть шугаринг и один-два сеанса лазера: полный курс лазерной эпиляции рассчитан на месяцы, а не на отпуск.'
      - q: "Есть ли противопоказания и можно ли на солнце после эпиляции?"
        a: 'Да, ограничения есть у каждого метода, и загар — главное из них. <a href="/lazernaya-epilyaciya/">Лазер</a> реагирует на пигмент, поэтому перед сеансом спрашивают, когда вы последний раз были на солнце, а на свежий загар процедуру переносят. После <a href="/saharnaya-epilyaciya/">сахарной эпиляции</a> коже дают отдохнуть от солнца и морской воды. В Neva Beauty — Koh Samui перед процедурой уточняют состояние кожи и недавние процедуры, поэтому на Самуи эпиляцию удобнее ставить накануне спокойного дня, а не перед пляжем.'
      - q: "Как записаться на эпиляцию?"
