        a: "Пигмент выводится постепенно: сеансы идут раз в месяц, между ними коже нужно восстановиться. Заметное осветление обычно видно после двух-трёх сеансов, а всего их может понадобиться до пятнадцати — зависит от плотности и глубины забивки, цвета краски, давности рисунка и особенностей кожи. План составляют после осмотра в Neva Beauty — Koh Samui."
      - q: "Какие цвета пигмента убирает лазер?"
        a: "Лазер работает и с чёрным пигментом, и со стойкими цветными — синим и зелёным. Разные краски отвечают на импульс по-разному, поэтому цветной рисунок обычно требует больше сеансов, чем чёрный. Полное исчезновение следа заранее не гарантируют: прогноз по конкретному рисунку в Neva Beauty — Koh Samui дают после осмотра, а окончательно он виден по реакции кожи на первый сеанс."
      - q: "Можно ли удалить перманентный макияж?"
        a: 'Да, лазером работают с татуажем бровей, век и губ — эти позиции есть в прайсе отдельно.'
      - q: "Насколько это ощутимо и что с кожей после?"
        a: "Ощущения зависят от зоны и болевого порога; чтобы их уменьшить, в Neva Beauty — Koh Samui используют аппликационную анестезию и охлаждение кожи. После сеанса участок требует ухода и защиты от солнца — на Самуи это принципиально, поэтому рекомендации дают сразу после процедуры. Сами средства для домашнего ухода в цену сеанса не входят и оплачиваются отдельно."
      - q: "Можно ли удалять тату с загаром и загорать между сеансами?"
        a: "На свежий загар в зоне рисунка — нет: лазер реагирует на пигмент, поэтому сеанс переносят. Сроки такие: не загорать 4–6 дней до сеанса, а после сеанса 7 дней держать обработанный участок без активного солнца и моря. На Самуи это стоит закладывать в план: курс удаления тату и пляжный отпуск плохо совмещаются, поэтому сроки обсуждают до первой процедуры."
      - q: "Как записаться на удаление тату?"
        a: 'Напишите в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a>, <a href="{telegram}" target="_blank" rel="noopener">Telegram</a> или <a href="{instagram}" target="_blank" rel="noopener">Instagram</a> и пришлите фото рисунка с указанием примерного размера — так в Neva Beauty — Koh Samui сразу назовут цену сеанса и предложат время.'

