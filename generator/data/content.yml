      - q: "Сколько процедур нужно и с каким интервалом?"
        a: "Обычно фотоомоложение M22 делают курсом: пигмент и сосуды уходят постепенно, от сеанса к сеансу. Сколько процедур понадобится и как часто их повторять, зависит от выраженности проблемы и типа кожи — программу составляют после осмотра в Neva Beauty — Koh Samui."
