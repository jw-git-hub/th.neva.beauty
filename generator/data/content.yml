        a: '<a href="/lazernaya-epilyaciya/">Лазер</a> воздействует светом на пигмент волоса и работает курсом. <a href="/saharnaya-epilyaciya/">Сахарная эпиляция</a> удаляет волос вместе с корнем механически, результат держится до отрастания. <a href="/elektroepilyaciya/">Электроэпиляция</a> обрабатывает каждый волос отдельно микроэлектродом и подходит для единичных и светлых волос.'
      - q: "Сколько сеансов эпиляции нужно и как часто её повторяют?"
        a: 'Волосы растут циклами, и за один раз обрабатываются не все. <a href="/lazernaya-epilyaciya/">Лазерную эпиляцию</a> поэтому делают курсом из 8–10 сеансов с интервалом 1,5–2 месяца. <a href="/elektroepilyaciya/">Электроэпиляцию</a> тоже делают курсом, но волос за волосом, и на следующий сеанс приходят, когда волосы отрастут. <a href="/saharnaya-epilyaciya/">Сахарную</a> повторяют по мере отрастания волос, обычно раз в несколько недель. Если вы на Самуи ненадолго, за поездку реально успеть шугаринг и один сеанс лазера: полный курс лазерной эпиляции идёт год и дольше, а не укладывается в отпуск.'
      - q: "Есть ли противопоказания и можно ли на солнце после эпиляции?"
        a: 'Да, ограничения есть у каждого метода, и загар — главное из них. У <a href="/lazernaya-epilyaciya/">лазерной эпиляции</a> срок такой: не загорать 7 дней до сеанса и 7 дней после — лазер реагирует на пигмент, и на свежий загар процедуру переносят. После <a href="/elektroepilyaciya/">электроэпиляции</a> кожу берегут от солнца и моря те же 7 дней. После <a href="/saharnaya-epilyaciya/">сахарной эпиляции</a> коже тоже дают отдохнуть, но отдельного срока салон не называет. В Neva Beauty — Koh Samui перед процедурой уточняют состояние кожи и недавние процедуры, поэтому на Самуи эпиляцию удобнее ставить накануне спокойного дня, а не перед пляжем.'
      - q: "Как записаться на эпиляцию?"
        a: 'Напишите в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a>, <a href="{telegram}" target="_blank" rel="noopener">Telegram</a> или <a href="{instagram}" target="_blank" rel="noopener">Instagram</a>, укажите зоны и метод. В Neva Beauty — Koh Samui приём ведётся по предварительной записи, обслуживание — на русском и английском.'

