        a: 'Начать стоит с диагностики: на Самуи волосы страдают от ультрафиолета, соли и влажности. В Neva Beauty — Koh Samui в таких случаях предлагают восстановление <a href="/tokio-inkarami/">Tokio Inkarami</a> или подбор персонального домашнего ухода <a href="/davines-naturaltech-tailoring/">Davines Naturaltech Tailoring</a>.'
