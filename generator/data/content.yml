        a: "Цену перманентного макияжа в Neva Beauty — Koh Samui называют парой «первая процедура и коррекция через 1–2 месяца»: брови — {price:permanentnyj-makiyazh:Перманентный макияж бровей - 1-я процедура} и {price:permanentnyj-makiyazh:Перманентный макияж бровей - 2-я процедура (1-2 мес)}, волосковая техника — {price:permanentnyj-makiyazh:Волосковая техника - 1-я процедура} и {price:permanentnyj-makiyazh:Волосковая техника - 2-я процедура (1-2 мес)}, губы — {price:permanentnyj-makiyazh:Перманентный макияж губ - 1-я процедура} и {price:permanentnyj-makiyazh:Перманентный макияж губ - 2-я процедура (1-2 мес)}, стрелки — {price:permanentnyj-makiyazh:Стрелки - 1-я процедура} и {price:permanentnyj-makiyazh:Стрелки - 2-я процедура (1-2 мес)}, межресничное пространство — {price:permanentnyj-makiyazh:Межресничное пространство - 1-я процедура} и {price:permanentnyj-makiyazh:Межресничное пространство - 2-я процедура (1-2 мес)}. Обновление до года — {price:permanentnyj-makiyazh:Обновление до года}. Все суммы в тайских батах (฿)."
      - q: "Перманентный макияж и татуаж — это одно и то же?"
        a: 'Да, это два названия одной процедуры: пигмент вводят в верхний слой кожи, и он держится месяцами. В Neva Beauty — Koh Samui делают татуаж бровей в пудровой и волосковой технике, губы, стрелки и межресничное пространство. Не путайте с удалением: если старый татуаж не нравится, его осветляют лазером — это <a href="/udalenie-tatuirovok-lazerom/">отдельная услуга</a>.'
      - q: "Зачем нужна вторая процедура?"
        a: "Пигмент приживается неравномерно: часть уходит в первые недели, и результат виден только когда кожа восстановилась. На коррекции через 1–2 месяца дорабатывают форму и насыщенность. Это штатная часть работы, поэтому её цена заранее указана в прайсе — {price:permanentnyj-makiyazh:Перманентный макияж бровей - 2-я процедура (1-2 мес)} против {price:permanentnyj-makiyazh:Перманентный макияж бровей - 1-я процедура} за первую."
      - q: "Сколько держится перманентный макияж?"
        a: "Заявленный срок — от 1,5 до 3 лет, но он сильно зависит от типа кожи, обмена веществ, ухода и количества солнца. На Самуи с его ультрафиолетом и морской водой цвет обычно тускнеет быстрее. Поэтому в прайсе есть отдельная позиция «обновление до года» за {price:permanentnyj-makiyazh:Обновление до года} — освежить цвет дешевле, чем делать перманентный макияж заново."
      - q: "Когда делать перманентный макияж, если я в отпуске на Самуи?"
        a: "В начале поездки и с оглядкой на пляж: первые дни зоне нужны уход и защита от солнца, поэтому с морем и загаром придётся подождать. Учтите и вторую встречу: коррекцию делают через 1–2 месяца, и если отпуск короче, её придётся проходить уже не в Neva Beauty — Koh Samui. Сроки обсудите при записи."
      - q: "Что нужно знать перед процедурой?"
        a: 'Эскиз и оттенок согласовывают до начала работы, а после процедуры зоне нужны уход и защита от солнца — с пляжем и морем первые дни придётся подождать. Если перманент уже есть и он вас не устраивает, его можно осветлить: смотрите <a href="/udalenie-tatuirovok-lazerom/">удаление тату и татуажа</a>.'
      - q: "Как записаться на перманентный макияж?"
        a: 'Напишите в <a href="{whatsapp}" target="_blank" rel="noopener">WhatsApp</a>, <a href="{telegram}" target="_blank" rel="noopener">Telegram</a> или <a href="{instagram}" target="_blank" rel="noopener">Instagram</a> и укажите зону: брови, губы или стрелки. Процедура занимает несколько часов, поэтому время в Neva Beauty — Koh Samui бронируют заранее.'
