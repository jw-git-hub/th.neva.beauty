name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой за раз; новые пуши отменяют предыдущий прогон.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site
        run: python generator/build.py

      # Ворота перед деплоем: сломанные цены, битая ссылка или след старого
      # бренда роняют сборку и в прод не уезжают.
      - name: Check prices
        working-directory: generator
        run: python check_prices.py

      - name: Check content
        run: python generator/check_content.py

      - name: Unit tests
        run: pytest generator/tests -q

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: th.neva.beauty

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
