name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "IndexNow: отправить все страницы sitemap, а не только изменённые"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой за раз; новые пуши отменяют предыдущий прогон.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site
        run: python generator/build.py

      # Ворота перед деплоем: сломанные цены, битая ссылка или след старого
      # бренда роняют сборку и в прод не уезжают.
      - name: Check prices
        working-directory: generator
        run: python check_prices.py

      - name: Check content
        run: python generator/check_content.py

      - name: Unit tests
        run: pytest generator/tests -q

      # Какие страницы изменились, видно только сейчас: после выкладки на сайте уже
      # новые. Сбой здесь не должен остановить деплой — отправка лишь ускоряет обход.
      - name: Changed pages for IndexNow
        id: indexnow
        continue-on-error: true
        run: |
          payload=$(python generator/indexnow.py ${{ inputs.indexnow_all && '--all' || '' }})
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: th.neva.beauty

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Bing и Яндекс узнают об изменённых страницах сразу, а не при следующем обходе.
  # Отдельной задачей: если отправка не прошла, выложенный сайт это не задевает.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_payload != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify Bing and Yandex via IndexNow
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 3
          --header 'Content-Type: application/json; charset=utf-8'
          --data "$PAYLOAD" https://api.indexnow.org/indexnow
          --write-out 'HTTP %{http_code}\n'
